
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} | Olivia Dal Pra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: #121212;
            color: white;
        }

        /* HEADER */

        #header {
            background-color: #080808;
            padding: 35px 7%;
            border-bottom: 1px solid #444;
        }

        #header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        #header-top a {
            color: #91afe2;
            text-decoration: none;
            font-size: 0.85em;
        }

        #header-top a:hover {
            color: white;
        }

        #masthead {
            text-align: center;
            border-top: 2px solid white;
            border-bottom: 2px solid white;
            padding: 18px 0px;
        }

        #masthead h1 {
            margin: 0;
            font-size: clamp(2em, 6vw, 4.5em);
            letter-spacing: -2px;
        }

        #masthead p {
            margin: 12px 0px 0px;
            color: #aaa;
            font-size: 0.8em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ARTICLE */

        #article {
            max-width: 850px;
            margin: 0 auto;
            padding: 65px 25px 90px;
        }

        #article-number {
            color: #91afe2;
            font-size: 0.8em;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        #article h2 {
            font-size: clamp(2em, 5vw, 3em);
            line-height: 1.25;
            margin: 0px 0px 20px;
        }

        /* ARTICLE HEADER IMAGE */

        #article-image {
            width: 100%;
            margin: 25px 0px 30px;
        }

        #article-image img {
            display: block;
            width: 100%;
            max-height: 440px;
            object-fit: cover;
            object-position: center;
        }

        #article-meta {
            color: #888;
            font-size: 0.8em;
            padding-bottom: 25px;
            border-bottom: 1px solid #383838;
            margin-bottom: 30px;
        }

        /* ARTICLE TEXT */

        #article-body p {
            color: #d0d0d0;
            font-size: 1em;
            line-height: 2;
            margin: 0px 0px 25px;
        }

        /* FOOTER */

        #footer {
            background-color: #080808;
            border-top: 1px solid #383838;
            padding: 30px 20px;
            text-align: center;
            color: #777;
            font-size: 0.8em;
        }

        #footer a {
            color: #91afe2;
            text-decoration: none;
        }

        #footer a:hover {
            color: white;
        }

        /* RESPONSIVE */

        @media (max-width: 650px) {
            #header {
                padding: 25px 20px;
            }

            #masthead h1 {
                letter-spacing: -1px;
            }

            #article {
                padding: 40px 22px 65px;
            }

            #article-image {
                margin: 20px 0px 25px;
            }

            #article-image img {
                max-height: 260px;
            }

            #article-body p {
                font-size: 0.92em;
                line-height: 1.85;
            }
        }


/**********************/
/* ADDITIONAL NAVIGATION */
/**********************/

#extra-navigation {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 30px 20px;
    background-color: #121212;
}

#extra-navigation a {
    display: inline-block;
    padding: 13px 28px;
    background-color: rgb(17, 54, 135);
    color: white;
    text-decoration: none;
    font-size: 1em;
    font-weight: bold;
    transition: background-color 0.2s;
}

#extra-navigation a:hover {
    background-color: rgb(10, 81, 182);
}

@media (max-width: 500px) {
    #extra-navigation {
        gap: 12px;
        padding: 25px 15px;
    }

    #extra-navigation a {
        padding: 12px 18px;
        font-size: 0.85em;
    }
}


    </style>
</head>

<body>


    <!-- Article -->

    <main id="article">

        <h2>{{ page.title }}</h2>

        <div id="article-image">
            <img src="/assets/images/articles/{{ page.slug }}.png" onerror='this.src = "/assets/images/articles/poems.png"'>
        </div>

        <div id="article-meta">
            {% if page.slug == "private-planes" %}
                By Maximillian Sinclair
            {% else %}
                By Olivia Dal Pra
            {% endif %}
        </div>

        <div id="article-body">

            {{ content }}

        </div>
        <hr>

    </main>


<div id="extra-navigation">
    <a href="/blog">Back to Blog</a>
    <a href="/film">Film/Sketch Work</a>
</div>
<br><Br><br>
    

</body>
</html>
